<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 처리 중 · 다모아</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: #f0f2f8;
            color: #1a1d27;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.06);
            padding: 36px 32px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(88, 101, 242, 0.15);
            border-top-color: #5865f2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #1a1d27; }
        p { font-size: 14px; color: #6b7299; line-height: 1.5; margin-bottom: 20px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #5865f2;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn:hover { background: #4752c4; }
        .error-icon {
            font-size: 40px;
            color: #e04545;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Discord 로그인 처리 중...</h2>
        <p id="desc">잠시만 기다려주세요. 계정 정보를 확인하고 있습니다.</p>
        <div id="btn-wrap" style="display:none;">
            <a href="/" class="btn"><i class="fas fa-arrow-left"></i> 대시보드로 돌아가기</a>
        </div>
    </div>

    <script>
        async function handleCallback() {
            // 1. Hash access_token (Implicit grant fallback)
            const hash = new URLSearchParams(window.location.hash.slice(1));
            if (hash.get('access_token')) {
                const token = hash.get('access_token');
                localStorage.setItem('damoa_token', token);
                window.location.href = '/#access_token=' + token + '&token_type=Bearer';
                return;
            }

            // 2. Query code (Authorization Code grant)
            const searchParams = new URLSearchParams(window.location.search);
            const code = searchParams.get('code');
            const error = searchParams.get('error');

            if (error) {
                showError('로그인이 취소되었거나 오류가 발생했습니다: ' + error);
                return;
            }

            if (!code) {
                showError('인증 코드가 전달되지 않았습니다.');
                return;
            }

            try {
                // Call serverless token endpoint
                const redirectUri = window.location.origin + '/auth/callback';
                const response = await fetch('/api/auth_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, redirect_uri: redirectUri })
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    localStorage.setItem('damoa_token', data.access_token);
                    document.getElementById('title').textContent = '로그인 완료!';
                    document.getElementById('desc').textContent = '대시보드로 이동합니다...';
                    window.location.href = '/#access_token=' + data.access_token + '&token_type=Bearer';
                } else {
                    showError(data.error || '토큰 발급에 실패했습니다. 다시 시도해주세요.');
                }
            } catch (err) {
                showError('서버 연결 중 오류가 발생했습니다: ' + err.message);
            }
        }

        function showError(msg) {
            document.getElementById('spinner').style.display = 'none';
            const card = document.getElementById('card');
            const errDiv = document.createElement('div');
            errDiv.className = 'error-icon';
            errDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
            card.insertBefore(errDiv, card.firstChild);
            document.getElementById('title').textContent = '로그인 실패';
            document.getElementById('desc').textContent = msg;
            document.getElementById('btn-wrap').style.display = 'block';
        }

        handleCallback();
    </script>
</body>
</html>
